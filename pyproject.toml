[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-data-platform"
version = "0.1.0"
description = "An offline, reproducible financial research data pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Joe May"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
fdp = "fdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdp = ["fixtures/*.csv", "fixtures/*.xml", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
